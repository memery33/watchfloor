name: GitHub Pages
on:
  push:
    branches: [main]
  # live.yml bot commits use GITHUB_TOKEN and do not re-trigger push workflows.
  # Hourly rebuild ~5m after live.yml (:20) keeps Pages current without a PAT.
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 scripts/fetch_live.py
        continue-on-error: true
      # NASA FIRMS VIIRS (keyless, public). Fail-safe: an outage keeps the committed fires.json.
      - run: python3 scripts/fetch_firms.py
        continue-on-error: true
        timeout-minutes: 3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Warn if live.json is stale
        run: |
          python3 - << 'PY' || true
          import json
          from datetime import datetime, timezone
          try:
              ts = json.load(open("public/data/live.json"))["generated_at"]
              age = datetime.now(timezone.utc) - datetime.fromisoformat(ts.replace("Z", "+00:00"))
              hours = age.total_seconds() / 3600
              if hours > 3:
                  print(f"::warning::live.json generated_at {ts} is {hours:.1f}h old (>3h)")
          except Exception as exc:  # never fail the run
              print(f"::warning::could not read live.json generated_at: {exc}")
          PY
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
