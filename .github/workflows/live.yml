name: Refresh live overlay
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/fetch_live.py
      - name: Commit overlay if changed
        id: commit
        run: |
          git config user.name "watchfloor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/live.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh GDELT live overlay"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # GITHUB_TOKEN pushes don't trigger pages.yml on push, and scheduled
      # runs get skipped for hours. Dispatch Pages directly after a commit.
      - name: Rebuild Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
