name: Refresh live overlay
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
# Default: read-only. Only the publish job gets write scopes.
permissions:
  contents: read
# Serialize scheduled + dispatched runs so two pushes can't collide.
concurrency:
  group: live-refresh
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 scripts/fetch_live.py
      - name: Warn if live.json is stale
        run: |
          python3 - << 'PY' || true
          import json
          from datetime import datetime, timezone
          try:
              ts = json.load(open("public/data/live.json"))["generated_at"]
              age = datetime.now(timezone.utc) - datetime.fromisoformat(ts.replace("Z", "+00:00"))
              hours = age.total_seconds() / 3600
              if hours > 3:
                  print(f"::warning::live.json generated_at {ts} is {hours:.1f}h old (>3h)")
          except Exception as exc:  # never fail the run
              print(f"::warning::could not read live.json generated_at: {exc}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-json
          path: public/data/live.json
          retention-days: 1
  publish:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: live-json
          path: public/data
      - name: Commit overlay if changed
        id: commit
        run: |
          git config user.name "watchfloor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/live.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh GDELT live overlay"
            # Another commit may have landed on main since checkout.
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # GITHUB_TOKEN pushes don't trigger pages.yml on push, and scheduled
      # runs get skipped for hours. Dispatch Pages directly after a commit.
      - name: Rebuild Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
