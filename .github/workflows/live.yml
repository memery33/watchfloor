name: Refresh live overlay
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/fetch_live.py
      - name: Commit overlay if changed
        run: |
          git config user.name "watchfloor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/live.json
          git diff --cached --quiet || git commit -m "Refresh GDELT live overlay"
          git push
